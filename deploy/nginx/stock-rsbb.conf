# Nginx site for Stock RSBB (see DEPLOY.md). Plain HTTP to start with:
# `certbot --nginx -d stock-rsbb.barokahperkasagroup.com` then adds the
# HTTPS server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name stock-rsbb.barokahperkasagroup.com;

    # Data Master accepts .xlsx/.csv uploads up to 3 MB (Nginx's default is 1 MB).
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # Next.js compares the request's Origin with this host to accept
        # Server Actions (the Data Master import), so pass the real host on.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
